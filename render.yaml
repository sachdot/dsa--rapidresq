services:
  - type: web
    name: rapidresq
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 18.20.8
      - key: TRUST_PROXY
        value: 1
      - key: JWT_SECRET
        generateValue: true
